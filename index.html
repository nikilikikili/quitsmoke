<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>QuitSmoke</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="app">
    <section id="join" class="screen">
      <h1>QuitSmoke</h1>
      <p class="tagline">Jedan dan u isto vrijeme</p>

      <div class="tabs">
        <button id="tabJoin" class="active">Pridruži se</button>
        <button id="tabCreate">Napravi party</button>
      </div>

      <div id="joinForm">
        <input type="text" id="joinCode" placeholder="Party kod (npr. 48291)" maxlength="6" />
        <input type="text" id="joinName" placeholder="Tvoje ime" />
        <button id="joinBtn">Uđi</button>
      </div>

      <div id="createForm" class="hidden">
        <input type="text" id="createName" placeholder="Tvoje ime" />
        <button id="createBtn">Napravi party</button>
      </div>
      <p id="authError" class="error"></p>
    </section>

    <section id="dashboard" class="screen hidden">
      <header>
        <div>
          <h2 id="welcome">Zdravo</h2>
          <div id="partyCode">Kod: ----</div>
        </div>
        <button id="logoutBtn" class="small">Izađi</button>
      </header>

      <div class="card hero">
        <div class="label">Od zadnje cigarete</div>
        <div id="timeCounter" class="big-number">0d 0h 0m</div>
        <div id="levelBadge">Level 1</div>
      </div>

      <div class="lungs-container">
        <div class="lungs">
          <div class="lung left"></div>
          <div class="lung right"></div>
        </div>
        <p id="lungsStatus">Pluća se oporavljaju...</p>
      </div>

      <div class="stats-grid">
        <div class="card stat">
          <div class="stat-value" id="cigsAvoided">0</div>
          <div class="stat-label">Izbjegnutih</div>
        </div>
        <div class="card stat">
          <div class="stat-value" id="moneySaved">$0</div>
          <div class="stat-label">Ušteđeno</div>
        </div>
      </div>

      <button id="logCigBtn" class="danger">Zapali sam cigaretu</button>

      <div class="card">
        <h3>Party</h3>
        <div id="membersList"></div>
      </div>
    </section>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
